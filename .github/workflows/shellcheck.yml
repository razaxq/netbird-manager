name: ShellCheck

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Pinned rather than apt's build: the distro version lags, and a version bump that adds a new
  # check would otherwise turn CI red on a commit that changed nothing. Bump deliberately.
  SHELLCHECK_VERSION: v0.11.0

jobs:
  lint:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install target shells
        run: sudo apt-get update -qq && sudo apt-get install -y dash busybox

      - name: Install shellcheck
        run: |
          set -eu
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL "$url" -o /tmp/shellcheck.tar.xz
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: ShellCheck (POSIX sh dialect)
        run: shellcheck -s sh netbird.sh tests/*.sh

      - name: Parse under every target shell
        run: |
          set -eu
          for interp in "sh" "dash" "busybox sh"; do
            echo "--- $interp -n"
            $interp -n netbird.sh
            $interp -n tests/test_manager.sh
          done

      - name: Unit tests under every target shell
        run: |
          set -eu
          for interp in "sh" "dash" "busybox sh"; do
            echo "=== $interp tests/test_manager.sh"
            $interp tests/test_manager.sh
          done

      - name: Subcommands that must work without root
        run: |
          set -eu
          sh netbird.sh help    > /dev/null
          sh netbird.sh version > /dev/null
